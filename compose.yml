services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: galleryvote
      POSTGRES_USER: galleryvote
      POSTGRES_PASSWORD: galleryvote
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U galleryvote"], interval: 5s, timeout: 3s, retries: 10}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
  api:
    build: .
    environment:
      GALLERY_DB_URL: jdbc:postgresql://postgres:5432/galleryvote
      GALLERY_DB_USER: galleryvote
      GALLERY_DB_PASSWORD: galleryvote
      GALLERY_STORAGE_ENDPOINT: http://minio:9000
      GALLERY_JWT_SECRET: local-compose-secret-change-before-deploying
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}, minio: {condition: service_started}}
volumes: {postgres-data: {}, minio-data: {}}
